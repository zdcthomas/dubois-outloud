server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Astro emits directory-style routes, so /chapter/1/ must find
  # /chapter/1/index.html.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Audio filenames carry the song slug and the LoC item id, so a different
  # recording is a different filename and these can cache forever.
  # Accept-Ranges lets a student scrub without refetching the whole file.
  location /audio/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Accept-Ranges bytes;
  }

  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;
  # MP3 and WebP are already compressed; gzipping them just burns CPU.

  error_page 404 /404.html;
}
