    rights: "The Library of Congress is not aware of any U.S. copyright protection (see Title 17, U.S.C.) or any other restrictions in the material in this collection, except as noted below. Users should keep in mind that the Library of Congress is providing access to these materials strictly for educational and research purposes. The written permission of the copyright owners and/or other holders of rights (such as publicity and/or privacy rights) is required for distribution, reproduction, or other use of protected items beyond that allowed by fair use or other statutory exemptions. Responsibility for making an independent legal assessment of an item and securing any necessary permissions ultimately rests with persons desiring to use the item. See our Legal Notices and Privacy and Publicity Rights for additional information and restrictions. The Center asks that researchers approach the materials in this collection with respect for the culture and sensibilities of the people whose lives, ideas, and creativity are documented here. Researchers are also reminded that privacy and publicity rights may pertain to certain uses of this material. An account of this collecting project is described in the essay Nuevo Mexicanos of the Upper Rio Grande: Culture, History, and Society . The Library of Congress has carefully researched the content of this collection to ascertain any possible legal rights embodied in the materials it contains. As is often the case with materials collected in the course of ethnographic field research, however, it is difficult or impossible to sufficiently identify specific songs sung by participants which precludes performing a comprehensive assessment of the copyright status of underlying musical rights in lyrics or compositions. The identification of specific speakers or singers included in sound recordings is also often difficult or sometimes impossible. It is our understanding that the folk music that Juan B. Rael collected in the summer of 1940 is within the public domain. Some of the alabado hymns in this collection are centuries old. The instrumental music dates to the mid-nineteenth century and some melodies are probably older. A few of the songs are twentieth century compositions but were created in traditional genres by anonymous authors and are part of the oral tradition as is the entire collection. The staff of the American Folklife Center is eager to learn more about the musical compositions included in the collection and encourages the public to contact us with any information. Credit Line Juan B. Rael collection (AFC 1940/002), American Folklife Center, Library of Congress"
