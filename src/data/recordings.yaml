    rights: "Using VHP Material in Publication or Exhibition The Veterans History Project (VHP) at the Library of Congress collects, preserves and makes accessible the firsthand recollections of U.S. military veterans who served from World War I through more recent conflicts and peacekeeping missions, so that future generations may hear directly from veterans and better understand what they saw, did and felt during their service. The Veterans History Project Collection includes oral histories along with documentary materials such as original letters, diaries, photographs, and memoirs. Veterans and interviewers contribute these materials to the Library for scholarly and educational purposes, retaining any copyright they may hold. Therefore, permission must be obtained before using the interview or other materials in exhibition or publication. Researchers or others who would like to make further use of these materials should contact the Veterans History Project for assistance. As a publicly supported institution, the Library generally does not own rights to material in its collections. Therefore, it does not charge permission fees for use of such material and cannot give or deny permission to publish or otherwise distribute material in its collections. Responsibility for making an independent legal assessment of an item from the Library's collections and for securing any necessary permissions rests with persons desiring to use the item. Please contact us with questions. Obtaining Copies of VHP Materials In order for VHP materials to be duplicated, we must receive written permission from the interviewee for you to obtain a copy of the recording unless the proposed use is limited to personal use, research, or other uses permissible by copyright law. If the interviewee is deceased, their next-of-kin may grant written permission. Please contact VHP for assistance if you need to contact a veteran for permission to use their materials in exhibition or publication, or if you have received permission from the veteran and need access to high-resolution copies of VHP collection materials. Citing VHP Materials Please use the following formats when citing Veterans History Project materials (substituting the appropriate name and collection ID number). Materials as a whole: John P. Snodgrass (AFC 2001/001/[VHP collection]), Veterans History Project Collection, American Folklife Center, Library of Congress. Manuscript material: John P. Snodgrass (AFC 2001/001/[VHP collection]), Memoirs (MS02), Veterans History Project Collection, American Folklife Center, Library of Congress. John P. Snodgrass (AFC 2001/001/[VHP collection]), Transcript (MS04), Veterans History Project Collection, American Folklife Center, Library of Congress. John P. Snodgrass (AFC 2001/001/[VHP collection]), Correspondence (MS01), Veterans History Project Collection, American Folklife Center, Library of Congress. Recording: John P. Snodgrass (AFC 2001/001/[VHP collection]), Audio recording (SR01), Veterans History Project Collection, American Folklife Center, Library of Congress. John P. Snodgrass (AFC 2001/001/[VHP collection]), Video recording (MV01), Veterans History Project Collection, American Folklife Center, Library of Congress. Photograph: John P. Snodgrass (AFC 2001/001/[VHP collection]), Photographs (PH01), photographer unknown, Veterans History Project Collection, American Folklife Center, Library of Congress. John P. Snodgrass (AFC 2001/001/[VHP collection]), Photographs (PH03-PH14), Ralph Williams photographer, Veterans History Project Collection, American Folklife Center, Library of Congress. Computer file: John P. Snodgrass (AFC 2001/001/[VHP collection]), Computer file (CF01), Veterans History Project Collection, American Folklife Center, Library of Congress. Artifact: John P. Snodgrass (AFC 2001/001/[VHP collection]), Artifact (AR01), Veterans History Project Collection, American Folklife Center, Library of Congress."
