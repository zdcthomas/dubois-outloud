# The spiritual Du Bois placed at each chapter head, from the 1903 edition.
#
# `scan` says where the bar of music comes from, in one of two shapes:
#
#   ia_item / page / crop  cut it out of a page scan of the 1903 first edition
#                          at the Internet Archive. Sharp, but the box has to
#                          be found by hand.
#   plate                  an already-cropped staff from the musical hypertext
#                          edition at way.net, which scanned all eighteen
#                          around 2000. About 440px wide, so softer, but free.
#
# Prefer `plate` until someone wants a sharper staff for a given chapter, then
# probe the page and replace it. Chapter 1 is already cropped that way.
#
# Chapter 14, "Of the Sorrow Songs", carries five songs rather than one.
# The Forethought and the Afterthought carry none and so have no entry.
- slug: nobody-knows-the-trouble-ive-seen
  chapter: 1
  title: "Nobody Knows the Trouble I've Seen"
  # `page` is the 0-based IIIF leaf index, not the printed page number.
  # Find the next one with:
  #   node scripts/crop-scans.mjs --probe cu31924024920492 <page>
  # then read the staff's bounds off the written PNG. Pages are 1272x2079.
  scan:
    ia_item: cu31924024920492
    page: 16
    crop: [130, 1170, 1150, 1350]
